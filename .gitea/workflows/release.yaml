name: Build and publish RoutePilot release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Register a Gitea Actions runner on macOS Apple Silicon with this label.
    runs-on: macos-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check installed build tools
        shell: bash
        run: |
          set -euo pipefail
          go version
          node --version
          npm --version
          python3 - <<'PY'
          import pathlib, re, subprocess
          required = re.search(r"^go (\d+)\.(\d+)\.(\d+)", pathlib.Path("go.mod").read_text(), re.M)
          installed = re.search(r"go(\d+)\.(\d+)\.(\d+)", subprocess.check_output(["go", "version"], text=True))
          assert required and installed and tuple(map(int, installed.groups())) >= tuple(map(int, required.groups())), "Runner Go version is too old"
          node = subprocess.check_output(["node", "--version"], text=True).strip().lstrip("v")
          assert tuple(map(int, node.split("."))) >= (22, 12, 0), "Runner needs Node.js 22.12+"
          PY
          command -v jq
          command -v xcrun
          command -v hdiutil

      - name: Set release identity
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]]
          python3 - "$version" "$GITHUB_RUN_NUMBER" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path("internal/buildinfo/release.json")
          release = json.loads(path.read_text())
          release["version"], release["build"] = sys.argv[1], sys.argv[2]
          path.write_text(json.dumps(release, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Install locked test dependencies
        run: |
          npm --prefix web ci

      - name: Install browser test runtime for stable release
        if: ${{ !contains(github.ref_name, '-beta.') }}
        run: npm --prefix web exec -- playwright install chromium

      - name: Test and verify stable release artifacts
        if: ${{ !contains(github.ref_name, '-beta.') }}
        run: |
          make verify-release
          make fuzz

      - name: Build and verify beta package without full test suite
        if: ${{ contains(github.ref_name, '-beta.') }}
        run: make package package-check

      - name: Publish Gitea release and assets
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          prerelease=false
          if [[ "$TAG" == *-beta.* ]]; then prerelease=true; fi
          : "${GITEA_TOKEN:?Gitea Actions token is unavailable}"
          notes_file=".gitea/release-notes/${TAG}.md"
          if [ ! -f "$notes_file" ]; then
            notes_file=$(mktemp)
            printf 'Automatically built by Gitea Actions.\n\nSee SHA256SUMS to verify downloaded assets.\n' > "$notes_file"
          fi
          release=$(curl --fail --silent --show-error \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H 'Content-Type: application/json' \
            -X POST "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
            --data "$(jq -n --arg tag "$TAG" --arg build "$BUILD_NUMBER" --argjson prerelease "$prerelease" --rawfile notes "$notes_file" \
              '{tag_name:$tag,name:("RoutePilot " + $tag),body:($notes + "\n\nGitea Actions Build " + $build + "."),draft:false,prerelease:$prerelease}')")
          release_id=$(printf '%s' "$release" | jq -er '.id')
          for asset in artifacts/RoutePilot-macos-arm64.dmg artifacts/RoutePilot-macos-arm64.zip artifacts/SHA256SUMS; do
            name=${asset##*/}
            curl --fail --silent --show-error \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -F "attachment=@${asset}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${name}"
          done
